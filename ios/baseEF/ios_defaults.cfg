// ===== Elite Force for iOS: one-time single-player defaults =====
// Applied once per IOS_DEFAULTS_VERSION (qcommon/common.c, stamp in_iosDefaults).
// From then on the saved config owns everything here: change any of it in the
// Controls / Setup menus and the change persists.

// ---- Display: the screen's native resolution (Retina pixels), full screen ----
seta r_mode -2
seta r_fullscreen 1
seta r_highdpi 1
seta com_maxfps 60
// the menus and loading screens in 4:3 (centered), the game itself full width
seta ui_menuAspect 1
seta cg_forceAspect 0
// sound memory: iOS mixes at 48 kHz, twice the space of the 22 kHz the 8 MB default was sized for
seta com_soundMegs 64

// ---- Game controller (SDL GameController: MFi, Xbox, PlayStation, Switch Pro).
//      The axes arrive as +/-32767; j_forward / j_side scale onto the +/-127 move
//      range (127/32767 = 0.0039 = full run at full throw). Look: degrees per ms
//      per axis unit, about 245 deg/s yaw and 180 deg/s pitch at full throw. ----
seta in_joystick 1
seta in_joystickUseAnalog 1
seta joy_threshold 0.15
seta j_forward -0.004
seta j_side    0.004
seta j_pitch   0.0055
seta j_yaw    -0.0075

// ---- Standard dual-analog FPS layout ----
bind PAD0_LEFTSTICK_UP     "+forward"
bind PAD0_LEFTSTICK_DOWN   "+back"
bind PAD0_LEFTSTICK_LEFT   "+moveleft"
bind PAD0_LEFTSTICK_RIGHT  "+moveright"
bind PAD0_RIGHTSTICK_UP    "+lookup"
bind PAD0_RIGHTSTICK_DOWN  "+lookdown"
bind PAD0_RIGHTSTICK_LEFT  "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_RIGHTTRIGGER     "+attack"
bind PAD0_LEFTTRIGGER      "+altattack"
bind PAD0_RIGHTSHOULDER    "weapnext"
bind PAD0_LEFTSHOULDER     "weapprev"
bind PAD0_A                "+moveup"
bind PAD0_B                "+movedown"
bind PAD0_X                "+use"
bind PAD0_Y                "weapnext"
bind PAD0_LEFTSTICK_CLICK  "+speed"
bind PAD0_RIGHTSTICK_CLICK "+zoom"
bind PAD0_DPAD_UP          "+button2"
bind PAD0_DPAD_DOWN        "+button3"
bind PAD0_DPAD_LEFT        "weapprev"
bind PAD0_DPAD_RIGHT       "weapnext"
bind PAD0_START            "togglemenu"
bind PAD0_BACK             "+info"
