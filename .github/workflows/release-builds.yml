# Signed builds: the Mac app (Developer ID, notarized and stapled, dmg + zip) and an ad-hoc iPhone /
# iPad .ipa, which goes to Firebase App Distribution.
#
# Runs on every push to main (not for changes to Markdown files only), on a pushed tag macos-v*,
# or by hand (Actions ▸ Release builds ▸ Run workflow). The builds contain no game data.
#
# Versions: a tag macos-v<ver> builds <ver>; other runs build make-app.sh's default version. The
# build number (CFBundleVersion) is the run number. On a tag the notarized Mac dmg and zip are
# added to that version's draft release (the one build.yml makes with the Windows and Linux
# downloads), which replaces `UPLOAD=1 macos/make-release.sh` on the maintainer's Mac. The .ipa is
# never put in a release: it only installs on the team's registered devices.
#
# Secrets (Settings ▸ Secrets and variables ▸ Actions). The names are the same as in
# outrun2-decomp, PairMagic and others; ~/Projects/SigningSecrets exports them from the login
# keychain and sets them (repos.conf).
#   DEVELOPER_ID_P12_BASE64           "Developer ID Application" certificate + key, .p12, base64
#   DEVELOPER_ID_P12_PASSWORD
#   APPLE_DISTRIBUTION_P12_BASE64     "Apple Distribution" certificate + key (signs the ad-hoc .ipa)
#   APPLE_DISTRIBUTION_P12_PASSWORD
#   NOTARY_API_KEY_P8                 App Store Connect API key: the .p8 file's text, its key ID
#   NOTARY_API_KEY_ID                 and issuer ID. Notarizes the Mac app; the iOS job uses it to
#   NOTARY_API_ISSUER_ID              register the bundle id and devices and to make the ad-hoc
#                                     profile (that needs a key with access to Certificates,
#                                     Identifiers & Profiles: Admin)
#   NOTARY_APPLE_ID                   instead of the API key, for the Mac notarization only:
#   NOTARY_APP_PASSWORD               an Apple ID and an app-specific password
# Variables:
#   IOS_BUNDLE_ID                     the iOS app's bundle id (registered by the iOS job if needed)
#   XCODE_VERSION                     optional, e.g. 27.2 (default: the newest Xcode on the runner)
#
# The ad-hoc profile is made fresh each run and holds every device registered for the team then
# (iPhones, iPads and the Vision Pro, which runs the iPad app).
#
# Firebase App Distribution: testers open the Firebase invite on their iPhone / iPad, which
# collects the device's UDID. Before signing, the iOS job registers those UDIDs with Apple
# (fastlane `sync_devices`), so the new .ipa installs on them; then it uploads the .ipa and invites
# the tester groups (FIREBASE_GROUPS, or the run-by-hand input).
#   secrets:   FIREBASE_SERVICE_ACCOUNT_JSON   a service account key (JSON) with the role
#                                              "Firebase App Distribution Admin"
#   variables: FIREBASE_PROJECT_NUMBER         Firebase console ▸ Project settings ▸ General
#              FIREBASE_IOS_APP_ID             the iOS app's App ID there (1:…:ios:…)
#              FIREBASE_GROUPS                 optional: tester group aliases (comma-separated)
# Apple allows 100 iPhones / iPads per membership year; a registered device keeps its slot until
# the year ends, even if removed.

name: Release builds

on:
  workflow_dispatch:
    inputs:
      mac:
        description: Build the Mac app (signed and notarized)
        type: boolean
        default: true
      ios:
        description: Build the iPhone / iPad .ipa
        type: boolean
        default: true
      sync_devices:
        description: Register the Firebase testers' devices with Apple first
        type: boolean
        default: true
      firebase:
        description: Upload the .ipa to Firebase App Distribution
        type: boolean
        default: true
      firebase_groups:
        description: Firebase tester groups to invite (comma-separated; empty = the FIREBASE_GROUPS variable)
        type: string
        default: ''
  push:
    branches: [main]
    tags: ['macos-v*']
    paths-ignore: ['**.md']

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

env:
  APPLE_TEAM_ID: B4H429V95D
  NOTARY_PROFILE: EliteForce-notary

jobs:
  mac:
    name: Mac app (notarized)
    if: github.event_name != 'workflow_dispatch' || inputs.mac
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then echo "VERSION=${GITHUB_REF_NAME#macos-v}" >> "$GITHUB_ENV"; fi
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install tools
        run: brew install cmake ninja pkg-config molten-vk vulkan-headers

      - name: Cache dependencies
        uses: actions/cache@v4.2.0
        with:
          path: |
            build-deps
            build-ffmpeg
          key: deps-macos-${{ github.event.repository.name }}-${{ hashFiles('deps/versions.sh', 'macos/build-deps.sh', 'macos/build-ffmpeg.sh') }}

      - name: Install the signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          [ -n "$P12_BASE64" ] || { echo "::error::The DEVELOPER_ID_P12_BASE64 secret isn't set"; exit 1; }
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -P "$RUNNER_TEMP/cert.p12"
          # Apple's Developer ID intermediate, so codesign can build the full chain (a .p12 that
          # already includes it makes this import report a duplicate).
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          if ! output=$(security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" 2>&1); then
            [[ "$output" == *"already exists"* ]] || { echo "$output"; exit 1; }
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # make-release.sh finds the notarytool profile in the default keychain
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Save the notarization credentials
        env:
          API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          if [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$KEYCHAIN" \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
            rm -P "$RUNNER_TEMP/AuthKey.p8"
          elif [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$KEYCHAIN" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APP_PASSWORD"
          else
            echo "::error::Set either the NOTARY_API_KEY_* secrets or NOTARY_APPLE_ID and NOTARY_APP_PASSWORD"
            exit 1
          fi

      # make-app.sh builds anything missing (deps, FFmpeg, game modules, engine); make-release.sh
      # signs with the Developer ID identity, notarizes and staples the app and the dmg.
      - name: Build, sign and notarize
        env:
          SIGN_IDENTITY: Developer ID Application
        run: |
          macos/make-release.sh | tee "$RUNNER_TEMP/release.log"
          grep -q "notarized" "$RUNNER_TEMP/release.log" || { echo "::error::The build wasn't notarized"; exit 1; }
          spctl --assess --type execute --verbose=2 "dist/Elite Force.app" || true
          xcrun stapler validate dist/EliteForce-MacOS-Marino-*-arm64.dmg

      - uses: actions/upload-artifact@v4.6.0
        with:
          name: macos-arm64-notarized
          path: |
            dist/EliteForce-MacOS-Marino-*-arm64.dmg
            dist/EliteForce-MacOS-Marino-*-arm64.zip
          if-no-files-found: error

      # Same release as build.yml's (it may be made by either job first).
      - name: Add to the version's release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#macos-v}"
          set -- dist/EliteForce-MacOS-Marino-"$ver"-arm64.dmg dist/EliteForce-MacOS-Marino-"$ver"-arm64.zip
          ls -l "$@"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            sed "s/@VERSION@/$ver/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "AwayTeamEF $ver" --notes-file "$RUNNER_TEMP/notes.md" ||
              gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null   # lost a race with build.yml
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$@"

      - name: Remove the keychain
        if: always()
        run: |
          security default-keychain -d user -s login.keychain-db 2>/dev/null || true
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true

  ios:
    name: iPhone / iPad ad-hoc .ipa
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    runs-on: macos-15
    timeout-minutes: 120
    env:
      IPA: dist/EliteForce-ios-adhoc.ipa
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Select Xcode
        run: |
          if [ -n "${{ vars.XCODE_VERSION }}" ]; then xcode="/Applications/Xcode_${{ vars.XCODE_VERSION }}.app"
          else xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Check secrets
        env:
          KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          DIST: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          BUNDLE: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          for v in KEY:NOTARY_API_KEY_P8 DIST:APPLE_DISTRIBUTION_P12_BASE64 BUNDLE:IOS_BUNDLE_ID; do
            eval "[ -n \"\$${v%%:*}\" ]" || { echo "::error::${v#*:} isn't set (see the comment at the top of this workflow)"; exit 1; }
          done

      - name: Version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then echo "VERSION=${GITHUB_REF_NAME#macos-v}" >> "$GITHUB_ENV"; fi
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install tools
        run: brew install cmake ninja pkg-config

      - name: Cache dependencies
        uses: actions/cache@v4.2.0
        with:
          path: build-ios-deps
          key: deps-ios-${{ hashFiles('ios/build-deps.sh', 'deps/versions.sh') }}-${{ runner.os }}

      - name: Install the signing certificate and the API key
        env:
          DIST_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DIST_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$DIST_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -P "$RUNNER_TEMP/cert.p12"
          # Apple's WWDR intermediate (G3) for the distribution chain.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          if ! output=$(security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" 2>&1); then
            [[ "$output" == *"already exists"* ]] || { echo "$output"; exit 1; }
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Set up fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Register the Firebase testers' devices
        if: vars.FIREBASE_PROJECT_NUMBER != '' && (github.event_name != 'workflow_dispatch' || inputs.sync_devices)
        env:
          FIREBASE_PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: bundle exec fastlane ios sync_devices

      - name: Make the ad-hoc profile
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          bundle exec fastlane ios adhoc_profile bundle_id:"${{ vars.IOS_BUNDLE_ID }}" name:"Elite Force" \
            output:"$RUNNER_TEMP/adhoc.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/adhoc.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          echo "Provisioned devices:"; /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" || true

      # builds the dependencies when not cached, the game modules and the engine, then signs
      - name: Build, sign and package
        run: |
          SDK=iphoneos BUNDLE_ID="${{ vars.IOS_BUNDLE_ID }}" SIGN_IDENTITY="Apple Distribution" \
            PROFILE="$RUNNER_TEMP/adhoc.mobileprovision" IPA="$PWD/$IPA" ios/make-app.sh
          codesign -d --entitlements - "dist/ios/Elite Force.app"

      - uses: actions/upload-artifact@v4.6.0
        with:
          name: ios-ipa
          path: ${{ env.IPA }}
          if-no-files-found: error

      - name: Upload to Firebase App Distribution
        if: vars.FIREBASE_IOS_APP_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.firebase)
        env:
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TESTER_GROUPS: ${{ inputs.firebase_groups || vars.FIREBASE_GROUPS }}
        run: |
          bundle exec fastlane ios distribute ipa:"$PWD/$IPA" groups:"$TESTER_GROUPS" \
            notes:"${VERSION:-} build ${{ github.run_number }}: $(git log -1 --format='%h %s')"

      - name: Remove the keychain and the API key
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -fP "$RUNNER_TEMP/AuthKey.p8"
